name: CI

on:
  push:
    branches: [ main, chore/deploy-in-ci-github-action ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build backend
      uses: docker/build-push-action@v4
      with:
        context: ./src/backend
        push: false
        load: true
        tags: taskflow-backend:latest

    - name: Build frontend
      uses: docker/build-push-action@v4
      with:
        context: ./src/frontend
        push: false
        load: true
        tags: taskflow-frontend:latest

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: kind

    - name: Load images into Kind
      run: |
        kind load docker-image taskflow-backend:latest --name kind
        kind load docker-image taskflow-frontend:latest --name kind

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0
    
    # Helm Dependency Build
    - name: Build Helm Dependencies (Redis/Postgres)
      run: |
        helm dependency update ./charts/taskflow
    
    - name: Lint Helm Chart
      run: |
        helm lint ./charts/taskflow

    - name: Deploy with Helm
      run: |
        helm upgrade --install taskflow ./charts/taskflow \
          -n taskflow --create-namespace \
          --set backend.image.repository=taskflow-backend \
          --set backend.image.tag=latest \
          --set backend.image.pullPolicy=Never \
          --set frontend.image.repository=taskflow-frontend \
          --set frontend.image.tag=latest \
          --set frontend.image.pullPolicy=Never

    - name: Verify Deployment
      run: |
        kubectl get pods -n taskflow
        # Wait for pods to be ready. Timeout set to 5 minutes.
        kubectl wait --namespace taskflow --for=condition=ready pod --selector=app.kubernetes.io/instance=taskflow --timeout=300s
        kubectl get pods -n taskflow

    - name: Run Helm Tests
      run: |
        helm test taskflow -n taskflow
