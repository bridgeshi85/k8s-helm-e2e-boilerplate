version: '3.8'

services:
  gateway:
    build:
      context: ./src/gateway
    ports:
      - "8080:80"
    depends_on:
      - backend

  worker:
    build:
      context: ./src/worker
    environment:
      - DATABASE_URL=postgresql://taskflow:changeme@postgres:5432/taskflow
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - TASK_QUEUE_NAME=task_queue
    depends_on:
      - postgres
      - rabbitmq

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=taskflow
      - POSTGRES_USER=taskflow
      - POSTGRES_PASSWORD=changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./src/backend
    environment:
      - DATABASE_URL=postgresql://taskflow:changeme@postgres:5432/taskflow
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - TASK_QUEUE_NAME=task_queue
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
