nameOverride: ""
fullnameOverride: "taskflow"

backend:
  replicaCount: 1
  image:
    repository: gto310/taskflow-backend
    tag: v1.1.0-otel
    pullPolicy: Always 
  service:
    type: ClusterIP
    port: 8000
  resources: 
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    LOG_LEVEL: "INFO"
    TASK_QUEUE_NAME: "task_queue"
    OTEL_SERVICE_NAME: "taskflow-backend"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://observability-opentelemetry-collector.observability.svc.cluster.local:4317"

frontend:
  replicaCount: 1
  image:
    repository: gto310/taskflow-frontend
    tag: v1.0.0
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

gateway:
  replicaCount: 1
  image:
    repository: nginx
    tag: 1.27-alpine
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  metrics:
    enabled: true
    servicePort: 9113
    path: /metrics
    interval: 15s
    image:
      repository: nginx/nginx-prometheus-exporter
      tag: 1.3.0
      pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

worker:
  replicaCount: 1
  image:
    repository: gto310/taskflow-worker
    tag: v1.1.0-otel
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  env:
    TASK_QUEUE_NAME: "task_queue"
    OTEL_SERVICE_NAME: "taskflow-worker"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://observability-opentelemetry-collector.observability.svc.cluster.local:4317"


# PostgreSQL
postgresql:
  enabled: true
  auth:
    username: "taskflow"
    password: "taskflowDatabase"
    database: "taskflow"
  fullnameOverride: "taskflow-postgresql"
  
  primary:
    persistence:
      enabled: false

  metrics:
    enabled: true
    servicePort: 9187
    serviceMonitor:
      enabled: true

rabbitmq:
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.0.2
  enabled: true
  fullnameOverride: "taskflow-rabbitmq"
  auth:
    username: "guest"
    password: "guest"
  metrics:
    enabled: true
    servicePort: 15692
    serviceMonitor:
      default: 
        enabled: true
  # 自动创建 压测报警规则 (PrometheusRule)
  prometheusRule:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack 
    rules:
      - alert: TooManyConnections
        expr: rabbitmq_connectionsTotal{service="{{ template "common.names.fullname" . }}"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Too many connections (instance {{ "{{ $labels.instance }}" }})
          description: |
              RabbitMQ instance has too many connections (> 1000)
              VALUE = {{ "{{ $value }}" }}\n  LABELS: {{ "{{ $labels }}" }}

ingress:
  className: "nginx"
