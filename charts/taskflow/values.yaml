# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: "taskflow"

backend:
  replicaCount: 1
  image:
    repository: gto310/taskflow-backend
    tag: v1.0.0
    # 本地 Kind 开发必须用 Never 或 IfNotPresent，生产环境建议 Always
    pullPolicy: IfNotPresent 
  service:
    type: ClusterIP
    port: 8000
  resources: 
    # 建议加上资源限制，展示 SDET 对性能和稳定性的关注
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    # 静态环境变量放这里，动态连接串(DB/Redis)建议在 Deployment 模板里拼装
    LOG_LEVEL: "INFO"

frontend:
  replicaCount: 1
  image:
    repository: gto310/taskflow-frontend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi


# Redis
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  # 固定 Service 名字，方便后端连接：taskflow-redis-master
  fullnameOverride: "taskflow-redis"

# PostgreSQL
postgresql:
  enabled: true
  auth:
    username: "taskflow"
    password: "taskflowDatabase"
    database: "taskflow"
  fullnameOverride: "taskflow-postgresql"
  
  primary:
    persistence:
      enabled: false