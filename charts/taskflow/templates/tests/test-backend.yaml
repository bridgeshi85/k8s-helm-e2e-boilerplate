apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskflow.fullname" . }}-test-backend
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: curlimages/curl:latest
    command: ["/bin/sh", "-c"]
    args:
      - "curl -s -f http://{{ include "taskflow.fullname" . }}-backend:{{ .Values.backend.service.port }} | grep -q 'Welcome to TaskFlow API'"