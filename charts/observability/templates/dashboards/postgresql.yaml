apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  postgresql.json: |
    {
      "title": "TaskFlow — PostgreSQL",
      "uid": "taskflow-postgresql",
      "tags": ["taskflow", "postgresql"],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 38,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Database Up",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "pg_up{namespace=\"taskflow\"}",
              "legendFormat": "pg_up"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Active Connections",
          "type": "stat",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(pg_stat_database_numbackends{namespace=\"taskflow\", datname!~\"template.*|postgres\"})",
              "legendFormat": "connections"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Transactions per Second",
          "type": "stat",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_xact_commit_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[1m]) + rate(pg_stat_database_xact_rollback_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[1m]))",
              "legendFormat": "tps"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops" }
          }
        },
        {
          "id": 4,
          "title": "Cache Hit Ratio",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_blks_hit_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[5m])) / (sum(rate(pg_stat_database_blks_hit_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[5m])) + sum(rate(pg_stat_database_blks_read_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[5m]))) * 100",
              "legendFormat": "cache hit %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 90 },
                  { "color": "green", "value": 99 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Active Connections over Time",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "pg_stat_database_numbackends{namespace=\"taskflow\", datname!~\"template.*|postgres\"}",
              "legendFormat": "{{datname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          }
        },
        {
          "id": 6,
          "title": "Commits & Rollbacks (rate)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_xact_commit_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[1m])) by (datname)",
              "legendFormat": "commits {{datname}}"
            },
            {
              "expr": "sum(rate(pg_stat_database_xact_rollback_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[1m])) by (datname)",
              "legendFormat": "rollbacks {{datname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "lineWidth": 2, "fillOpacity": 6 }
            }
          }
        },
        {
          "id": 7,
          "title": "Rows Fetched vs Returned (rate)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_tup_fetched_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[1m]))",
              "legendFormat": "fetched"
            },
            {
              "expr": "sum(rate(pg_stat_database_tup_returned_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[1m]))",
              "legendFormat": "returned"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "rps",
              "custom": { "lineWidth": 2, "fillOpacity": 6 }
            }
          }
        },
        {
          "id": 8,
          "title": "Deadlocks",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(pg_stat_database_deadlocks_total{namespace=\"taskflow\", datname!~\"template.*|postgres\"}[1m])",
              "legendFormat": "deadlocks/s {{datname}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "lineWidth": 2, "fillOpacity": 6 },
              "color": { "fixedColor": "red", "mode": "fixed" }
            }
          }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource"
          }
        ]
      }
    }
