{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "observability.fullname" . }}-taskflow
  namespace: {{ .Values.serviceMonitor.namespace }}
  labels:
    app: {{ include "observability.name" . }}
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.serviceMonitor.selector.matchLabels | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Values.serviceMonitor.namespace }}
  endpoints:
    {{- toYaml .Values.serviceMonitor.endpoints | nindent 4 }}
{{- end }}
