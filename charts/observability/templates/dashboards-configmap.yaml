{{- if .Values.dashboards.enabled }}
{{- range $name, $config := .Values.dashboards }}
{{- if and (ne $name "enabled") (kindIs "map" $config) $config.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" $ }}-dashboard-{{ $name }}
  labels:
    {{- include "observability.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{ $name }}.json: |
    {{ $.Files.Get (printf "dashboards/%s.json" $name) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
