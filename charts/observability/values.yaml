loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    
    commonConfig:
      replication_factor: 1

    storage:
      type: 'filesystem'
      
    schemaConfig:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

  # 关闭 Memcached 缓存
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  lokiCanary:
    enabled: false
  
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # 限制 Loki 本体的资源
  singleBinary:
    replicas: 1
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
  
  minio:
    enabled: false

  test:
    enabled: false

kube-prometheus-stack:
  alertmanager:
    enabled: false

  nodeExporter:
    enabled: false

  prometheus:
    prometheusSpec:
      # 允许 Prometheus 发现不带 Helm Release Label 的 ServiceMonitor
      serviceMonitorSelectorNilUsesHelmValues: false
      
      # 允许匹配任意 Label 的 ServiceMonitor
      serviceMonitorSelector: {}
      
      # 允许跨 Namespace 扫描
      serviceMonitorNamespaceSelector: {}

      # 允许 k6 通过 remote-write 直接推送压测指标（k6_* 系列，供 k6-load-test dashboard 使用）
      enableRemoteWriteReceiver: true

  grafana:
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
    adminUser: admin
    adminPassword: strongpassword

  # 关掉这些在 Kind 里抓不到或者不需要的组件
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false


promtail:
  enabled: true
  
  config:
    clients:
      - url: http://observability-loki-gateway.observability/loki/api/v1/push
        tenant_id: 1

# Grafana Dashboards
dashboards:
  # 是否启用自定义 Dashboard
  enabled: true

  # TaskFlow 应用所在的 namespace（taskflow chart 是独立 release，
  # 和本 chart 的 Release.Namespace 不是同一个，因此不能用 .Release.Namespace）
  taskflowNamespace: taskflow

  # Nginx Gateway Dashboard
  nginx-gateway:
    enabled: true
  
  # PostgreSQL Dashboard
  postgresql:
    enabled: true
  
  # RabbitMQ Dashboard
  rabbitmq:
    enabled: true
  
  # Container Resources Dashboard
  container-resources:
    enabled: true
  
  # k6 Load Test Dashboard
  k6-load-test:
    enabled: true